# MQTT broker for the flotilla stack.
#
# Shared by both consumers: flotilla's standalone Tiltfile and the robotics
# local-orchestration Tiltfile (which passes this file as an extra path to
# docker_compose([...])). The build context is an absolute path via
# ${FLOTILLA_ROOT} because, when multiple compose files are combined, Docker
# Compose resolves relative build contexts against the FIRST file's directory --
# which is the robotics dir, not this one. Both callers export FLOTILLA_ROOT.
services:
  mqtt-broker:
    build:
      context: ${FLOTILLA_ROOT}/broker
    container_name: flotilla-mqtt-broker
    ports:
      - "1883:1883"
    # Credentials generated for this machine by tilt/preflight.py, which both
    # callers run before `tilt up`. Absolute for the same reason as the build
    # context above. MQTT_REQUIRE_ENV_CREDENTIALS makes falling back to the
    # credentials committed to the image a startup failure rather than a warning,
    # so a broker that did not get this file fails loudly instead of running on
    # material every environment shares.
    env_file: ${FLOTILLA_ROOT}/broker/.env
    environment:
      MQTT_REQUIRE_ENV_CREDENTIALS: "true"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep mosquitto || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s
