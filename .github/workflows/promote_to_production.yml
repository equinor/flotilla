name: Promote to Production
permissions:
  contents: read
  pull-requests: read
  packages: write

# Only one workflow in a concurrency group may run at a time
concurrency:
  group: production-concurrency
  cancel-in-progress: true

on:
  workflow_dispatch:

jobs:
  trigger-github-deployment:
    name: Trigger GitHub Deployment
    environment: Production
    runs-on: ubuntu-latest
    steps:
      - name: Empty Step
        run: echo "Hello World"

  get_staging_version:
    name: Get version from staging
    needs: trigger-github-deployment
    outputs:
      versionTag: ${{ steps.get_version_tag.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6
        with:
          ref: main
          repository: equinor/robotics-infrastructure
          ssh-key: ${{ secrets.ROBOTICS_INFRASTRUCTURE_DEPLOY_KEY }}

      - name: Get Flotilla version in staging
        id: get_version_tag
        run: |
          TAG_LINE_NUMBER=$(($(grep -n "roboticsstagingacr.azurecr.io/robotics/flotilla-frontend" k8s_kustomize/robotics/overlays/staging/kustomization.yaml |  cut --delimiter=":" --fields=1)+1))
          VERSION_TAG=$(sed -n "${TAG_LINE_NUMBER}p" k8s_kustomize/robotics/overlays/staging/kustomization.yaml  |  cut --delimiter=":" --fields=2 | tr -d '[:space:]')
          echo "tag=$VERSION_TAG" >> "$GITHUB_OUTPUT"

  run_migrations:
    name: Update database in Production
    needs: [get_staging_version, trigger-github-deployment]
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    uses: equinor/armada/.github/workflows/run_dotnet_migrations.yml@main
    with:
      environment: Production
      checkout_ref: ${{ needs.get_staging_version.outputs.versionTag }}
      working_directory: backend/api
      azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

  copy-images-to-robotics-prod-registry:
    name: Copy staging images to robotics prod registry
    needs: [get_staging_version, trigger-github-deployment]
    strategy:
      matrix:
        component: ['broker', 'backend', 'frontend']
    permissions:
      contents: read
      # Declared by the shared workflow for its OIDC path; a called
      # workflow can never exceed the calling job.
      id-token: write
    uses: equinor/armada/.github/workflows/copy_image_between_registries.yml@main
    with:
      source_registry: roboticsstagingacr.azurecr.io
      destination_registry: roboticsprodacr.azurecr.io
      image_name: robotics/flotilla-${{ matrix.component }}
      tag: ${{ needs.get_staging_version.outputs.versionTag }}
      # Authenticate to both registries with a federated credential
      # instead of the registry passwords. The identity holds AcrPull
      # on staging and AcrPush on production, because promotion reads
      # from one and writes to the other.
      use_oidc: true
      environment: Production
      azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    secrets:
      source_registry_username: ${{ secrets.ROBOTICS_ROBOTICSSTAGINGACR_USERNAME }}
      source_registry_password: ${{ secrets.ROBOTICS_ROBOTICSSTAGINGACR_PASSWORD }}
      destination_registry_username: ${{ secrets.ROBOTICS_ROBOTICSPRODACR_USERNAME }}
      destination_registry_password: ${{ secrets.ROBOTICS_ROBOTICSPRODACR_PASSWORD }}

  deploy:
    name: Update deployment in Production
    needs: [get_staging_version, trigger-github-deployment, copy-images-to-robotics-prod-registry]
    strategy:
      max-parallel: 1
      matrix:
        component: [frontend, backend, broker]
    uses: equinor/armada/.github/workflows/update_kubernetes_deployment.yml@main
    with:
      environment: production
      tag: ${{ needs.get_staging_version.outputs.versionTag }}
      registry: roboticsprodacr.azurecr.io
      image_name: robotics/flotilla-${{ matrix.component }}
      author_name: ${{ github.actor }}
      infrastructure_repository: equinor/robotics-infrastructure
      kustomization_base_path: k8s_kustomize/robotics/overlays
      commit_message_service_name: Flotilla
    secrets:
      deploy_key: ${{ secrets.ROBOTICS_INFRASTRUCTURE_DEPLOY_KEY }}
